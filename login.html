<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Slate 1.1</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="center-page">
  <div class="card">
    <h2 style="margin-top:0">Owner / partner login</h2>
    <div id="demoBanner" class="banner" style="display:none">
      Demo mode — login is disabled until Firebase is configured. See README.md.
    </div>
    <div id="errorBanner" class="banner" style="display:none; background:var(--busy-bg); border-color:var(--busy);"></div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input required type="email" name="email" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input required type="password" name="password" autocomplete="current-password" />
      </div>
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
    <p class="helper-text" style="margin-top:14px">
      Accounts are created manually in the Firebase console — there's no public sign-up.
      <a href="index.html">← Back to public calendar</a>
    </p>
  </div>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
